{% extends "dashboard/base_admin.html" %}

{% block title %}إدارة الطلاب - لوحة التحكم{% endblock %}

{% block page %}
<div class="space-y-6">
    <!-- Header Section -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900/40 backdrop-blur-xl border border-slate-800 p-6 rounded-3xl">
        <div class="flex items-center gap-4">
            <div class="p-3 rounded-2xl bg-cyan-500/10 text-cyan-400">
                <i data-lucide="users" class="w-8 h-8"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black text-slate-100">إدارة الطلاب</h1>
                <p class="text-sm text-slate-400 font-medium">إضافة، تعديل، وحذف بيانات الطلاب وربطهم بالمجموعات</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <a href="{% url 'dashboard:admin_registrations_list' %}"
               class="inline-flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-slate-800/50 hover:bg-slate-800 text-slate-200 text-sm font-bold transition-all border border-slate-700">
                <i data-lucide="clipboard-list" class="w-4 h-4 text-slate-400"></i>
                <span>طلبات التسجيل</span>
            </a>
            <a href="{% url 'dashboard:admin_student_create' %}"
               class="inline-flex items-center gap-2 px-6 py-2.5 rounded-2xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-sm font-black transition-all shadow-lg shadow-cyan-500/20">
                <i data-lucide="user-plus" class="w-4 h-4"></i>
                <span>إضافة طالب</span>
            </a>
        </div>
    </div>

    <!-- Filters Card -->
    <div class="bg-slate-900/40 backdrop-blur-xl border border-slate-800 p-4 rounded-3xl">
        <form method="get" id="students-filter-form" class="grid gap-4 md:grid-cols-12 items-end">
            <div class="md:col-span-6 space-y-2">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mr-2">البحث الذكي</label>
                <div class="relative group">
                    <i data-lucide="search" class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-600 group-focus-within:text-cyan-400 transition-colors"></i>
                    <input type="text" name="q" value="{{ q }}" id="students-search-input"
                           placeholder="ابحث بالاسم، رقم الطالب، المدرسة، البريد، الهاتف، المجموعة..."
                           autocomplete="off"
                           class="w-full pr-11 pl-4 py-2.5 rounded-2xl bg-slate-950 border border-slate-800 text-slate-200 placeholder:text-slate-700 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition-all font-bold text-sm">
                </div>
            </div>
            <div class="md:col-span-4 space-y-2">
                <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mr-2">تصفية بالمجموعة</label>
                <div class="relative group">
                    <i data-lucide="layers" class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-600 group-focus-within:text-cyan-400 transition-colors pointer-events-none"></i>
                    <select name="group" id="students-group-select"
                            class="w-full pr-11 pl-4 py-2.5 rounded-2xl bg-slate-950 border border-slate-800 text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition-all font-bold text-sm appearance-none">
                        <option value="">كل المجموعات</option>
                        {% for group in groups %}
                        <option value="{{ group.id }}" {% if group_id == group.id|stringformat:"s" %}selected{% endif %}>
                            {{ group.name }} ({{ group.code }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="md:col-span-2">
                <button type="submit"
                        class="w-full py-2.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-100 text-sm font-bold transition-all border border-slate-700 flex items-center justify-center gap-2 group">
                    <i data-lucide="filter" class="w-4 h-4 group-hover:scale-110 transition-transform"></i>
                    تطبيق
                </button>
            </div>
        </form>
    </div>

    <!-- Count Bar & Table (loaded via partial for AJAX updates) -->
    <div id="students-table-container">
        {% include 'dashboard/partials/admin_students_table.html' %}
    </div>
</div>

<script>
    (function() {
        var searchInput = document.getElementById('students-search-input');
        var groupSelect = document.getElementById('students-group-select');
        var tableContainer = document.getElementById('students-table-container');
        var timer = null;
        var currentPage = 1;

        function buildQueryString(page) {
            var params = new URLSearchParams();
            if (searchInput.value.trim()) params.set('q', searchInput.value.trim());
            if (groupSelect.value) params.set('group', groupSelect.value);
            if (page && page > 1) params.set('page', page);
            return params.toString();
        }

        function fetchStudents(page) {
            if (timer) clearTimeout(timer);
            timer = setTimeout(function() {
                var query = buildQueryString(page);
                var url = window.location.pathname + (query ? '?' + query : '');

                tableContainer.style.opacity = '0.5';
                tableContainer.style.pointerEvents = 'none';

                fetch(url, {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' },
                    credentials: 'same-origin'
                })
                .then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text();
                })
                .then(function(html) {
                    tableContainer.innerHTML = html;
                    tableContainer.style.opacity = '1';
                    tableContainer.style.pointerEvents = 'auto';
                    if (window.lucide) window.lucide.createIcons();
                    currentPage = page || 1;
                    window.history.replaceState({}, '', url);
                })
                .catch(function() {
                    tableContainer.style.opacity = '1';
                    tableContainer.style.pointerEvents = 'auto';
                });
            }, 300);
        }

        if (searchInput) {
            searchInput.addEventListener('input', function() { fetchStudents(1); });
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    fetchStudents(1);
                }
            });
        }
        if (groupSelect) {
            groupSelect.addEventListener('change', function() { fetchStudents(1); });
        }

        // Hijack pagination links
        tableContainer.addEventListener('click', function(e) {
            var link = e.target.closest('a[href*="page="]');
            if (!link) return;
            e.preventDefault();
            var url = new URL(link.href, window.location.origin);
            var page = parseInt(url.searchParams.get('page')) || 1;
            if (searchInput.value.trim()) url.searchParams.set('q', searchInput.value.trim());
            if (groupSelect.value) url.searchParams.set('group', groupSelect.value);
            fetchStudents(page);
        });
    })();
</script>
{% endblock %}
